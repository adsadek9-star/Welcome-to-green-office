<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المكتب الأخضر</title>
<style>
:root{--bg:#eef6ef;--card:#fff;--text:#16301e;--muted:#5d7566;--accent:#2e8b4f;--accent2:#1877f2;--border:#d4e6d9;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a13;--card:#17251c;--text:#e9f4ec;--muted:#94ad9e;--accent:#3fae67;--border:#26382c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a13;--card:#17251c;--text:#e9f4ec;--muted:#94ad9e;--accent:#3fae67;--border:#26382c;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;display:flex;justify-content:center;padding:24px 16px}
.wrap{width:100%;max-width:420px}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px 22px;margin-bottom:16px;text-align:center}
.logo{display:block;width:170px;height:170px;object-fit:contain;margin:0 auto 14px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo{background:#fff;border-radius:26px;padding:8px}}
:root[data-theme="dark"] .logo{background:#fff;border-radius:26px;padding:8px}
h1{font-size:1.5rem;margin:0 0 8px;color:var(--accent)}
p{color:var(--muted);margin:0 0 18px;line-height:1.7}
.btn{display:block;width:100%;padding:14px;font-size:1rem;font-weight:600;border-radius:12px;text-decoration:none;margin-bottom:10px;border:2px solid transparent}
.primary{background:var(--accent);color:#fff}
.fb{background:var(--accent2);color:#fff}
.ghost{background:transparent;color:var(--accent);border-color:var(--accent)}
.small{font-size:.85rem;margin-bottom:0}
h2{font-size:1.2rem;margin:0 0 6px;color:var(--accent)}
#gitem{font-size:3.6rem;line-height:1.2;margin:10px 0 2px}
#gname{font-weight:600;margin-bottom:14px}
#gitem svg{width:96px;height:96px}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bins button{padding:14px 8px;font-size:1rem;font-weight:600;border-radius:12px;border:2px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer}
.bins button:disabled{opacity:.6}
.bins button.ok{border-color:var(--accent);background:var(--accent);color:#fff;opacity:1}
.bins button.no{border-color:#d9534f;opacity:1}
#gfb{min-height:1.4em;margin-top:12px;font-weight:600}
</style>
</head>

var order=[],idx=0,score=0,TOTAL=10,locked=false,tm=null;
var $=function(id){return document.getElementById(id)};
function startGame(){
  order=ITEMS.slice().sort(function(){return Math.random()-.5}).slice(0,TOTAL);
  idx=0;score=0;locked=false;$("gfb").textContent="";nextItem();
}
function nextItem(){
  var box=$("gbins");box.textContent="";locked=false;
  if(idx>=TOTAL){return finish();}
  var it=order[idx];
  $("gscore").textContent="السؤال "+(idx+1)+" من "+TOTAL+" — النقاط: "+score;
  $("gitem").innerHTML=it[0];$("gname").textContent="";startTimer();
  BINS.forEach(function(b){
    var btn=document.createElement("button");btn.textContent=b[1].replace(/^\S+\s/,"");btn.dataset.k=b[0];
    btn.addEventListener("click",function(){pick(b[0],btn)});box.appendChild(btn);
  });
}
function startTimer(){
  var t=7;$("gname").textContent="⏱ "+t;clearInterval(tm);
  tm=setInterval(function(){t--;$("gname").textContent="⏱ "+t;if(t<=0){clearInterval(tm);pick(null,null);}},1000);
}
function pick(k,btn){
  if(locked)return;locked=true;clearInterval(tm);
  var right=order[idx][2];
  Array.prototype.forEach.call($("gbins").children,function(x){
    x.disabled=true;if(x.dataset.k===right)x.classList.add("ok");
  });
  if(k===right){score++;$("gfb").textContent="✅ برافو!";}
  else{if(btn)btn.classList.add("no");$("gfb").textContent="❌ الصح هو المحدد بالأخضر";}
  idx++;setTimeout(function(){$("gfb").textContent="";nextItem();},1100);
}
function finish(){
  $("gscore").textContent="";$("gitem").textContent=score>=8?"🏆":score>=5?"🌱":"♻️";
  $("gname").textContent="نتيجتك "+score+" من "+TOTAL;
  var msg=score>=8?"بطل الاستدامة! 🌍":score>=5?"كويس جداً، كمّل وهتبقى محترف 🌿":"مفيش مشكلة، جرّب تاني وتعلّم الفرز الصح ♻️";
  $("gfb").textContent=msg;
  var b=document.createElement("button");b.textContent="العب تاني 🔄";
  b.style.gridColumn="1 / -1";b.addEventListener("click",startGame);$("gbins").appendChild(b);
}
startGame();
